<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#0a0a2e"/>
  <!-- Road -->
  <rect x="20" y="60" width="88" height="40" fill="#333333"/>
  <rect x="55" y="78" width="18" height="4" fill="#ffff00"/>
  <!-- Moped body -->
  <ellipse cx="64" cy="65" rx="20" ry="10" fill="#e63946"/>
  <circle cx="48" cy="75" r="8" fill="#222" stroke="#888" stroke-width="2"/>
  <circle cx="80" cy="75" r="8" fill="#222" stroke="#888" stroke-width="2"/>
  <!-- Rider -->
  <circle cx="64" cy="50" r="8" fill="#f4a261"/>
  <rect x="58" y="55" width="12" height="10" fill="#2a9d8f"/>
  <!-- Package -->
  <rect x="68" y="52" width="10" height="10" fill="#e9c46a" stroke="#264653" stroke-width="1"/>
  <!-- Stars -->
  <text x="10" y="25" font-size="14" fill="#ffff00">★</text>
  <text x="100" y="25" font-size="14" fill="#ffff00">★</text>
  <!-- Title -->
  <text x="64" y="18" font-size="9" fill="white" text-anchor="middle" font-family="monospace" font-weight="bold">COLMADO</text>
  <text x="64" y="28" font-size="9" fill="#e63946" text-anchor="middle" font-family="monospace" font-weight="bold">DASH</text>
</svg>
